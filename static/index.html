<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商数据智能分析 Agent</title>
<style>
  :root{
    --accent:#1b4f7e;
    --accent-2:#2d7fc1;
    --accent-soft:#eaf1f8;
    --bg:#f4f6f9;
    --card:#ffffff;
    --line:#e2e8f0;
    --text:#1a202c;
    --text-2:#4a5568;
    --text-3:#8a95a5;
    --ok:#2f855a;
    --err:#c53030;
    --code-bg:#1e2a38;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    background:var(--bg);color:var(--text);
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---------- 顶栏 ---------- */
  header{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;align-items:center;gap:16px;flex:0 0 auto;
  }
  .logo{
    width:32px;height:32px;border-radius:8px;flex:0 0 auto;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:17px;
  }
  .titles h1{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .titles p{font-size:11.5px;color:var(--text-3);margin-top:1px;}
  .spacer{flex:1;}
  .status{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);
    background:var(--accent-soft);padding:8px 12px;border-radius:8px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e0;}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(47,133,90,.15);}
  .dot.off{background:var(--err);box-shadow:0 0 0 3px rgba(197,48,48,.15);}
  .ghost-btn{
    border:1px solid var(--line);background:#fff;color:var(--text-2);
    font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .ghost-btn:hover{border-color:var(--accent-2);color:var(--accent);}
  /* 跳转类按钮：去掉下划线，和 button 表现一致 */
  a.ghost-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;}

  /* ---------- 消息区 ---------- */
  /* 垂直居中：空状态时内容落在视觉重心上，不再顶对齐留一大片空白；
     有消息后 .wrap 高度撑开，自然回到顶部对齐 */
  main{
    flex:1;overflow-y:auto;padding:24px 0;scroll-behavior:smooth;
    display:flex;flex-direction:column;justify-content:center;
  }
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:0 24px;}
  main.has-msg{justify-content:flex-start;}

  .welcome{text-align:center;padding:0 0 24px;}
  .welcome h2{font-size:19px;font-weight:700;color:var(--accent);letter-spacing:.5px;}
  .welcome .lead{font-size:13px;color:var(--text-3);margin-top:8px;line-height:1.7;}

  /* 空状态的数据概览：数字来自 /api/health 的真实统计 */
  .stats{display:flex;justify-content:center;gap:48px;margin-top:24px;flex-wrap:wrap;}
  .stats .cell{min-width:96px;}
  .stats .n{
    font-size:28px;font-weight:700;color:var(--accent);line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .stats .k{font-size:11.5px;color:var(--text-3);margin-top:8px;}

  /* 示例问题：按主题分三组卡片，替代平铺一排 chip */
  .groups{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    margin-top:24px;text-align:left;
  }
  .group{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:8px;
  }
  .group h3{
    font-size:12px;font-weight:600;color:var(--text-2);
    display:flex;align-items:center;gap:8px;
  }
  .group h3 svg{color:var(--accent-2);flex:0 0 auto;}
  .q{
    text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;
    font-family:inherit;line-height:1.6;transition:.15s;
  }
  .q:hover{border-color:var(--accent-2);color:var(--accent);background:var(--accent-soft);}

  .msg{display:flex;gap:12px;margin-bottom:24px;}
  .avatar{
    width:32px;height:32px;border-radius:8px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .msg.user .avatar{background:var(--accent-soft);color:var(--accent);}
  .msg.bot .avatar{background:var(--accent-2);color:#fff;}
  .bubble{flex:1;min-width:0;}
  .msg.user .bubble{
    background:var(--accent);color:#fff;padding:12px 16px;border-radius:var(--radius);
    border-top-left-radius:4px;font-size:13.5px;line-height:1.65;
    display:inline-block;max-width:100%;word-break:break-word;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;margin-bottom:8px;
  }
  .card-head{
    padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-2);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
    background:#fafbfd;
  }
  .card-head .tag{
    font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;
    background:var(--accent-soft);color:var(--accent);
  }
  .card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .card-body{padding:12px 16px;}

  /* 步骤 */
  .steps{display:flex;flex-wrap:wrap;gap:8px;}
  .step{
    font-size:11.5px;padding:4px 12px;border-radius:5px;
    background:#f0f3f7;color:var(--text-3);display:flex;align-items:center;gap:8px;
  }
  .step.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .step.done{background:#eaf6ee;color:var(--ok);}
  .step .sp{
    width:9px;height:9px;border:1.8px solid currentColor;border-radius:50%;
    border-top-color:transparent;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* SQL */
  pre.sql{
    background:var(--code-bg);color:#dbe7f3;padding:16px;margin:0;
    font-family:"Cascadia Code",Consolas,"Courier New",monospace;
    font-size:12.5px;line-height:1.65;overflow-x:auto;white-space:pre-wrap;
    word-break:break-word;
  }
  pre.sql .kw{color:#7fc4ff;font-weight:600;}
  pre.sql .fn{color:#f0c674;}
  pre.sql .str{color:#a5e6a5;}
  pre.sql .num{color:#f7a6a6;}

  /* 表格 */
  .table-scroll{max-height:330px;overflow:auto;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th{
    position:sticky;top:0;background:#f7f9fc;color:var(--text-2);font-weight:600;
    text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:8px 12px;border-bottom:1px solid #f0f3f7;color:var(--text-2);white-space:nowrap;}
  tbody tr:hover{background:#fafcff;}
  tbody tr:last-child td{border-bottom:none;}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;}

  /* 洞察 */
  .insight{
    background:var(--accent-soft);
    border-left:3px solid var(--accent-2);
    padding:16px;font-size:13.5px;line-height:1.8;color:var(--text-2);
  }
  .insight strong{color:var(--accent);}
  .insight ol{margin:8px 0 0 20px;}
  .insight li{margin-bottom:4px;}

  .err{
    background:#fff5f5;border:1px solid #fed7d7;border-left:3px solid var(--err);
    padding:12px 16px;font-size:13px;color:#9b2c2c;border-radius:8px;line-height:1.6;
  }
  /* 拒答提示：这是"能力边界"而不是"系统故障"，所以用中性色，不用报错红 */
  .info{
    background:#f7fafc;border:1px solid var(--line);border-left:3px solid var(--accent-2);
    padding:12px 16px;font-size:13px;color:var(--text);border-radius:8px;line-height:1.7;
  }
  .meta{font-size:11.5px;color:var(--text-3);margin-top:4px;}

  .empty{padding:16px;text-align:center;color:var(--text-3);font-size:12.5px;}

  /* ---------- 输入区 ---------- */
  footer{
    flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
    padding:16px 24px;
  }
  .input-row{
    max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
    background:var(--bg);border:1.5px solid var(--line);border-radius:12px;
    padding:8px 8px 8px 16px;transition:.15s;
  }
  .input-row:focus-within{border-color:var(--accent-2);background:#fff;
    box-shadow:0 0 0 3px rgba(45,127,193,.1);}
  textarea{
    flex:1;border:none;outline:none;background:transparent;resize:none;
    font-family:inherit;font-size:13.5px;line-height:1.6;color:var(--text);
    max-height:130px;min-height:24px;padding:4px 0;
  }
  textarea::placeholder{color:#a9b3c1;}
  button.send{
    flex:0 0 auto;width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  button.send:disabled{opacity:.35;cursor:not-allowed;}
  button.send:not(:disabled):hover{background:var(--accent-2);}
  .hint{max-width:900px;margin:8px auto 0;font-size:11px;color:var(--text-3);text-align:center;}

  /* ---------- 弹层 ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(26,32,44,.45);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:50;
  }
  .modal.show{display:flex;}
  .modal-box{
    background:#fff;border-radius:var(--radius);max-width:660px;width:100%;
    max-height:78vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-box .card-head{background:#fff;padding:16px;font-size:13.5px;color:var(--text);}
  .modal-box pre{
    padding:16px;overflow:auto;font-size:12.5px;line-height:1.7;
    font-family:Consolas,monospace;color:var(--text-2);white-space:pre-wrap;
  }

  /* ---------- 响应式：≤768px ---------- */
  @media (max-width:768px){
    header{padding:12px 16px;gap:8px;flex-wrap:wrap;}
    .titles p{display:none;}
    main{padding:16px 0;justify-content:flex-start;}
    .wrap{padding:0 16px;}
    .groups{grid-template-columns:1fr;gap:8px;}
    .stats{gap:24px;}
    footer{padding:12px 16px;}
    .hint{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">◈</div>
  <div class="titles">
    <h1>电商数据智能分析 Agent</h1>
    <p>自然语言问数 · 自动生成 SQL · 输出业务洞察</p>
  </div>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
  <a class="ghost-btn nav-btn" href="/console">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"></path><path d="M7 15l4-5 3 3 5-7"></path>
    </svg>
    运营台
  </a>
  <button class="ghost-btn" id="clearBtn">清空对话</button>
  <button class="ghost-btn" id="schemaBtn">表结构</button>
</header>

<main id="main">
  <div class="wrap" id="stream">
    <div class="welcome" id="welcome">
      <h2>用一句话问你的数据</h2>
      <p class="lead">自动生成 SQL、查询数据库，并给出业务解读与运营建议。</p>
      <div class="stats" id="stats">
        <div class="cell"><div class="n" id="statTables">–</div><div class="k">数据表</div></div>
        <div class="cell"><div class="n" id="statRows">–</div><div class="k">数据行数</div></div>
        <div class="cell"><div class="n" id="statCols">–</div><div class="k">可分析字段</div></div>
      </div>      <div class="groups" id="groups"></div>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="例如：帮我找出购买次数前十的用户，并给出运营策略"></textarea>
    <button class="send" id="send" title="发送（Enter）">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="hint">Enter 发送 · Shift + Enter 换行 · 支持多轮追问</div>
</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="card-head">Agent 当前看到的表结构<span class="right"><button class="ghost-btn" id="modalClose">关闭</button></span></div>
    <pre id="schemaText">加载中…</pre>
  </div>
</div>

<script>
/* 示例问题按主题分组：比平铺一排 chip 更容易看出"这个工具能回答哪类问题" */
const EXAMPLE_GROUPS = [
  {
    title: '用户分析',
    icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>',
    items: [
      '帮我找出购买次数前十的用户，并给出运营策略',
      '购买次数最多的用户集中在哪几天',
      '有多少用户只浏览过一次就再也没回来'
    ]
  },
  {
    title: '转化漏斗',
    icon: '<path d="M3 4h18l-7 8v6l-4 2v-8z"></path>',
    items: [
      '各行为类型（浏览/收藏/加购/购买）的数量分布',
      '浏览到购买的转化率是多少',
      '哪些商品被加购但没购买最多'
    ]
  },
  {
    title: '趋势与商品',
    icon: '<path d="M3 3v18h18"></path><path d="M7 15l4-5 3 3 5-7"></path>',
    items: [
      '每天的活跃用户数趋势是怎样的',
      '被浏览最多的前十个商品是哪些',
      '收藏最多但一次都没买的商品有哪些'
    ]
  }
];

const streamEl = document.getElementById('stream');
const mainEl = document.getElementById('main');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const welcomeEl = document.getElementById('welcome');

let history = [];
let busy = false;

/* ---------------- 初始化：渲染示例问题分组 ---------------- */
const groupsEl = document.getElementById('groups');
EXAMPLE_GROUPS.forEach(g => {
  const box = document.createElement('div');
  box.className = 'group';
  const h3 = document.createElement('h3');
  h3.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${g.icon}</svg>${g.title}`;
  box.appendChild(h3);
  g.items.forEach(t => {
    const b = document.createElement('button');
    b.className = 'q';
    b.textContent = t;
    b.onclick = () => { inputEl.value = t; autoGrow(); submit(); };
    box.appendChild(b);
  });
  groupsEl.appendChild(box);
});

/* ---------------- 后端地址解析 ----------------
   这个页面可能被三种方式打开：
     1. python app.py 启动后访问 http://127.0.0.1:8000 —— 同源，相对路径直接可用
     2. IDE / 编辑器的静态预览，或其他静态服务器 —— 只有静态文件，没有后端
     3. 直接双击 index.html（file://）—— 同样没有后端
   后两种情况下，同源请求必然 404，这里自动回连到本机的 8000 端口，
   这样无论从哪里打开页面都能正常工作。
*/
let API_BASE = '';

async function resolveBackend() {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    if (r.ok) { API_BASE = ''; return await r.json(); }
    throw new Error('HTTP ' + r.status);
  } catch (e) {
    const fallback = 'http://127.0.0.1:8000';
    const r = await fetch(fallback + '/api/health', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    API_BASE = fallback;
    return await r.json();
  }
}

/* 空状态的数据概览：数字全部来自真实接口
   表数量 / 数据行数 → /api/health；可分析字段 → /api/schema（数一下提示词里的字段行） */
function renderStats(health, fieldCount) {
  document.getElementById('statTables').textContent =
    (health.table_count != null) ? health.table_count : '–';
  document.getElementById('statRows').textContent =
    (health.rows != null) ? health.rows.toLocaleString() : '–';
  document.getElementById('statCols').textContent =
    (fieldCount != null) ? fieldCount : '–';
}

resolveBackend().then(d => {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('statusText');
  if (d.database) {
    dot.className = 'dot on';
    txt.textContent = `${d.database_name} · ${d.table_count} 张表 · ${d.rows.toLocaleString()} 行`;
    renderStats(d, null);
    // 可分析字段数：从表结构提示词里数出来，失败就保持 "–"，不影响页面
    fetch(API_BASE + '/api/schema')
      .then(r => r.json())
      .then(s => {
        if (!s.ok) return;
        const n = (s.schema.match(/^\s*- /gm) || []).length;
        renderStats(d, n || null);
      })
      .catch(() => {});
  } else {
    dot.className = 'dot off';
    txt.textContent = '数据库未连接';
    document.getElementById('statTables').textContent = '–';
    document.getElementById('statRows').textContent = '–';
    document.getElementById('statCols').textContent = '–';
    addBot([{ type: 'error', text: '数据库连接失败。请确认 MySQL 已启动，并在项目根目录的 .env 里填好 ' +
      'DB_USER / DB_PASSWORD / DB_NAME；详细报错见后端 logs/app.log。' }]);
  }
  if (!d.api_key) {
    addBot([{ type: 'error', text: '未检测到 DEEPSEEK_API_KEY。请复制 .env.example 为 .env 并填入你的 Key，然后重启服务。' }]);
  }
}).catch(() => {
  document.getElementById('dot').className = 'dot off';
  document.getElementById('statusText').textContent = '后端未响应';
  addBot([{ type: 'error', text:
    '连不上后端服务。\n\n' +
    '当前页面是以静态方式打开的（自身没有后端），同时本机 8000 端口也没有服务在运行。\n\n' +
    '解决办法：先在项目根目录下启动服务\n' +
    '    python app.py\n' +
    '然后访问 http://127.0.0.1:8000\n\n' +
    '注意：不要直接双击 index.html，也不要用编辑器的静态预览打开它——那样只有页面、没有后端。' }]);
});

/* ---------------- 输入框 ---------------- */
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
}
inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
sendBtn.onclick = submit;

/* ---------------- 发送 ---------------- */
async function submit() {
  const q = inputEl.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true;
  chat.currentQuestion = q;
  inputEl.value = ''; autoGrow();
  if (welcomeEl) welcomeEl.style.display = 'none';
  mainEl.classList.add('has-msg');   // 有消息后取消垂直居中，回到顶部对齐

  addUser(q);
  chat.messages.push({ role: 'user', text: q });
  const ui = addBotShell();
  scrollDown();

  try {
    const res = await fetch(API_BASE + '/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, history })
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        const ev = parseEvent(p);
        if (ev) handle(ev.name, ev.data, ui);
      }
    }
    history.push({ question: q, sql: ui.sql || '', result_summary: ui.digest || '' });
    if (history.length > 6) history = history.slice(-6);
    chat.apiHistory = history;
    saveChat();
  } catch (err) {
    ui.add({ type: 'error', text: '请求失败：' + err.message });
  } finally {
    ui.finish();
    busy = false; sendBtn.disabled = false;
    inputEl.focus();
    scrollDown();
  }
}

function parseEvent(chunk) {
  let name = 'message', data = '';
  for (const line of chunk.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { name, data: JSON.parse(data) }; } catch { return null; }
}

/* ---------------- 消息渲染 ---------------- */
function scrollDown() { mainEl.scrollTop = mainEl.scrollHeight; }

function addUser(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="avatar">我</div><div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  streamEl.appendChild(el);
  scrollDown();
}

function addBot(blocks) { const ui = addBotShell(); blocks.forEach(b => ui.add(b)); ui.finish(); return ui; }

function addBotShell() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `<div class="avatar">◈</div><div class="bubble"></div>`;
  streamEl.appendChild(el);
  const bubble = el.querySelector('.bubble');

  const state = { sql: '', digest: '', started: Date.now() };
  let stepsBox = null;
  const stepMap = new Map();

  function steps() {
    if (!stepsBox) {
      stepsBox = document.createElement('div');
      stepsBox.className = 'card';
      stepsBox.innerHTML = '<div class="card-body"><div class="steps"></div></div>';
      bubble.appendChild(stepsBox);
    }
    return stepsBox.querySelector('.steps');
  }

  function markStep(stage, text, cls) {
    const box = steps();
    let s = stepMap.get(stage);
    if (!s) {
      s = document.createElement('div');
      s.className = 'step';
      box.appendChild(s);
      stepMap.set(stage, s);
    }
    s.className = 'step ' + (cls || '');
    s.innerHTML = (cls === 'active' ? '<span class="sp"></span>' : '') + escapeHtml(text);
  }

  return {
    get sql() { return state.sql; },
    get digest() { return state.digest; },
    add(block) {
      if (block.type === 'stage') { markStep(block.stage, block.text, 'active'); }
      else if (block.type === 'sql') {
        state.sql = block.sql;
        if (block.blocked) {
          markStep('sql', 'SQL 被安全护栏拦截', 'done');
        } else {
          markStep('sql', 'SQL 已生成', 'done');
          if (block.adjusted) markStep('query', '已自动补充 LIMIT 保护', 'done');
        }
        bubble.appendChild(sqlCard(block.sql, block.attempt, block.adjusted, block.blocked));
      }
      else if (block.type === 'result') {
        markStep('query', `查询完成 · ${block.total.toLocaleString()} 行`, 'done');
        bubble.appendChild(resultCard(block));
      }
      else if (block.type === 'refusal') {
        // 模型判定超出表结构能力范围：这是能力边界，不是报错
        markStep('sql', '已判断为超出当前数据范围', 'done');
        const d = document.createElement('div');
        d.className = 'info';
        d.textContent = '无法回答：' + block.reason + '（可以换个口径，或先把相关字段接入数据源）';
        bubble.appendChild(d);
      }
      else if (block.type === 'insight') {
        markStep('insight', '业务洞察已生成', 'done');
        bubble.appendChild(insightCard(block.text));
      }
      else if (block.type === 'error') {
        stepMap.forEach(s => { if (s.className.includes('active')) s.className = 'step'; });
        const d = document.createElement('div');
        d.className = 'err';
        // 只展示后端给的友好文案（原始报错在后端 logs/app.log 里）；
        // 安全护栏的拦截属于产品语义，单独用标签标出来
        d.textContent = (block.blocked ? '已拦截 · ' : '') + block.text;
        bubble.appendChild(d);
      }
      scrollDown();
    },
    finish() {
      stepMap.forEach(s => { if (s.className.includes('active')) s.className = 'step done'; });
      if (!bubble.querySelector('.card, .err')) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = '没有返回结果';
        bubble.appendChild(d);
      }
    }
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* SQL 高亮：单次扫描完成，避免先转义导致字符串字面量匹配不上 */
const KW = "select|from|where|group\\s+by|order\\s+by|having|limit|as|and|or|not|in|on|join|left|right|inner|outer|distinct|count|sum|avg|max|min|between|like|desc|asc|with|case|when|then|else|end|over|partition\\s+by|is|null";
const HL_RE = new RegExp(`('(?:[^']|'')*')|(\\b(?:${KW})\\b)|(\\b\\d+(?:\\.\\d+)?\\b)`, 'gi');

function highlight(sql) {
  // 只转义 & < >，保留单引号——<pre> 里引号无需转义，转义了反而破坏字符串高亮
  const escaped = String(sql)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  return escaped.replace(HL_RE, (m, str, kw, num) => {
    if (str !== undefined) return `<span class="str">${str}</span>`;
    if (kw !== undefined) return `<span class="kw">${kw}</span>`;
    return `<span class="num">${num}</span>`;
  });
}

function sqlCard(sql, attempt, adjusted, blocked) {
  const c = document.createElement('div');
  c.className = 'card';
  const tags = [`<span class="tag">SQL</span>`];
  if (attempt > 1) tags.push(`<span class="tag">第 ${attempt} 次尝试</span>`);
  if (adjusted) tags.push(`<span class="tag">已加 LIMIT</span>`);
  if (blocked) tags.push(`<span class="tag" style="background:#fff5f5;color:#c53030">已拦截</span>`);
  c.innerHTML = `<div class="card-head">${tags.join('')}
      <span class="right"><button class="ghost-btn copy">复制</button></span>
    </div><pre class="sql">${highlight(sql)}</pre>`;
  c.querySelector('.copy').onclick = e => {
    navigator.clipboard.writeText(sql);
    e.target.textContent = '已复制';
    setTimeout(() => e.target.textContent = '复制', 1200);
  };
  return c;
}

function resultCard(block) {
  const c = document.createElement('div');
  c.className = 'card';
  let head = `<div class="card-head"><span class="tag">结果</span>
      共 ${block.total.toLocaleString()} 行${block.truncated ? `，仅显示前 ${block.rows.length} 行` : ''}
      <span class="right">
        <button class="ghost-btn fb-up" title="这个答案有用">👍</button>
        <button class="ghost-btn fb-down" title="结果不对 / 不是我要的">👎</button>
        <button class="ghost-btn csv">导出 CSV</button>
      </span></div>`;

  if (!block.rows.length) {
    c.innerHTML = head + '<div class="empty">查询结果为空</div>';
    return c;
  }

  // 数字列右对齐；但 ID / 日期这类「标识与时间」列保持左对齐，
  // 否则表头与数值之间会拉开一大段空白
  const ID_LIKE = /(^|[^a-z])(id|编号|序号|号|code|编码|日期|时间|date|time)/i;
  const numeric = block.columns.map((col, i) => {
    const allNumeric = block.rows.every(r =>
      r[i] === null || typeof r[i] === 'number' || /^-?\d+(\.\d+)?$/.test(String(r[i])));
    return allNumeric && !ID_LIKE.test(col);
  });

  let html = '<div class="table-scroll"><table><thead><tr>';
  block.columns.forEach((col, i) =>
    html += `<th${numeric[i] ? ' class="num-cell"' : ''}>${escapeHtml(col)}</th>`);
  html += '</tr></thead><tbody>';
  block.rows.forEach(r => {
    html += '<tr>';
    r.forEach((v, i) => {
      const cls = numeric[i] ? ' class="num-cell"' : '';
      html += `<td${cls}>${v === null ? '<span style="color:#c3cbd6">NULL</span>' : escapeHtml(v)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  c.innerHTML = head + html;

  c.querySelector('.csv').onclick = e => {
    const esc = v => {
      const s = v === null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [block.columns.map(esc).join(',')];
    block.rows.forEach(r => lines.push(r.map(esc).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'query_result.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    e.target.textContent = '已导出';
    setTimeout(() => e.target.textContent = '导出 CSV', 1200);
  };

  // 👍/👎 反馈：一次点击就多一条真实标注，落盘到后端 feedback.jsonl
  const upBtn = c.querySelector('.fb-up');
  const downBtn = c.querySelector('.fb-down');
  function sendFeedback(rating, btn) {
    fetch(API_BASE + '/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating, question: block.question || '', sql: block.sql || '' })
    }).then(() => {
      upBtn.disabled = downBtn.disabled = true;
      btn.textContent = '已记录';
    }).catch(() => { btn.textContent = '记录失败'; });
  }
  upBtn.onclick = () => sendFeedback('up', upBtn);
  downBtn.onclick = () => sendFeedback('down', downBtn);
  return c;
}

function insightCard(text) {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<div class="card-head"><span class="tag">业务洞察</span>AI 生成</div>
    <div class="insight">${renderMd(text)}</div>`;
  return c;
}

function renderMd(t) {
  let s = escapeHtml(t);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const lines = s.split('\n');
  let out = '', inOl = false;
  for (const line of lines) {
    const m = line.match(/^\s*(\d+)[.、)]\s*(.+)$/);
    if (m) {
      if (!inOl) { out += '<ol>'; inOl = true; }
      out += `<li>${m[2]}</li>`;
    } else {
      if (inOl) { out += '</ol>'; inOl = false; }
      if (line.trim()) out += `<div>${line}</div>`;
    }
  }
  if (inOl) out += '</ol>';
  return out;
}

/* ---------------- 表结构弹层 ---------------- */
const modal = document.getElementById('modal');
document.getElementById('modalClose').onclick = () => modal.classList.remove('show');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };
document.getElementById('schemaBtn').onclick = async () => {
  modal.classList.add('show');
  const pre = document.getElementById('schemaText');
  pre.textContent = '加载中…';
  try {
    const r = await fetch(API_BASE + '/api/schema').then(r => r.json());
    pre.textContent = r.ok ? r.schema : ('读取失败：' + r.error);
  } catch (e) { pre.textContent = '读取失败：' + e.message; }
};

/* ---------------- 本地历史（localStorage） ----------------
   刷新页面不该丢掉刚才问过什么。存两样东西：
   messages = 界面能重放的最小数据；apiHistory = 发给后端的多轮上下文。
   注意 API 上下文里带 digest（列名+行数+前几行），存盘时会压到只留列名和行数，
   否则 localStorage 会迅速被表格数据撑满。
*/
const CHAT_KEY = 'nl2sql_chat_v1';
const chat = { messages: [], apiHistory: [], currentQuestion: '' };

function compactDigest(digest) {
  return String(digest || '').replace(/前 \d+ 行：.*$/, '').trim();
}

function saveChat() {
  try {
    localStorage.setItem(CHAT_KEY, JSON.stringify({
      messages: chat.messages.slice(-30),
      apiHistory: chat.apiHistory.slice(-6).map(h => ({
        question: h.question || '',
        sql: h.sql || '',
        result_summary: compactDigest(h.result_summary)
      }))
    }));
  } catch (e) { /* 隐私模式 / 超配额时静默降级 */ }
}

function loadChat() {
  try {
    const raw = localStorage.getItem(CHAT_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.messages)) return null;
    return data;
  } catch (e) { return null; }
}

/* 把存下来的对话重放回界面：只重建卡片，不重新请求后端 */
function restoreChat(data) {
  const items = data.messages || [];
  if (!items.length) return;
  if (welcomeEl) welcomeEl.style.display = 'none';
  mainEl.classList.add('has-msg');
  for (const it of items) {
    if (it.role === 'user') { addUser(it.text || ''); continue; }
    const ui = addBotShell();
    if (it.sql) ui.add({ type: 'sql', sql: it.sql });
    if (it.result) {
      ui.add({ type: 'result', ...it.result, sql: it.sql || '',
               question: (it.result && it.result.question) || '' });
    }
    if (it.insight) ui.add({ type: 'insight', text: it.insight });
    if (it.refusal) ui.add({ type: 'refusal', reason: it.refusal });
    if (it.error) ui.add({ type: 'error', text: it.error });
    ui.finish();
  }
  chat.apiHistory = data.apiHistory || [];
  history = chat.apiHistory;     // 多轮上下文一起恢复
  scrollDown();
}

document.getElementById('clearBtn').onclick = () => {
  chat.messages = []; chat.apiHistory = []; history = [];
  streamEl.innerHTML = '';
  welcomeEl.style.display = '';
  mainEl.classList.remove('has-msg');
  try { localStorage.removeItem(CHAT_KEY); } catch (e) { /* 忽略 */ }
};

/* ---------------- SSE 事件分发 ---------------- */
function handle(name, data, ui) {
  if (name === 'stage') {
    ui.add({ type: 'stage', stage: data.stage, text: data.text });
    return;
  }
  if (name === 'sql') {
    if (!data.blocked) chat.messages.push({ role: 'bot', sql: data.sql });
    ui.add({ type: 'sql', sql: data.sql, attempt: data.attempt, adjusted: data.adjusted, blocked: data.blocked });
  }
  else if (name === 'result') {
    // 结果里带上 SQL 和问题：👎 反馈要能定位到具体哪次问答
    const block = { type: 'result', ...data, sql: ui.sql, question: chat.currentQuestion };
    const last = chat.messages[chat.messages.length - 1];
    if (last && last.role === 'bot' && !last.result) {
      last.result = {
        columns: block.columns, rows: block.rows, total: block.total,
        truncated: block.truncated, question: block.question
      };
    } else {
      chat.messages.push({ role: 'bot', sql: ui.sql,
        result: { columns: block.columns, rows: block.rows, total: block.total,
                  truncated: block.truncated, question: block.question } });
    }
    ui.add(block);
  }
  else if (name === 'insight') {
    chat.messages.push({ role: 'bot', insight: data.text });
    ui.add({ type: 'insight', text: data.text });
  }
  else if (name === 'refusal') {
    chat.messages.push({ role: 'bot', refusal: data.reason });
    ui.add({ type: 'refusal', reason: data.reason });
  }
  else if (name === 'error') {
    chat.messages.push({ role: 'bot', error: data.text });
    ui.add({ type: 'error', text: data.text, blocked: data.blocked });
  }
  else return;
  saveChat();
}

/* ---------------- 启动：恢复上一次的会话 ---------------- */
const saved = loadChat();
if (saved) restoreChat(saved);
</script>
</body>
</html>
